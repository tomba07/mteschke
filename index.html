<!DOCTYPE html>
<html lang="en" data-page="terminal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mirko.dev</title>
  <meta name="description" content="Mirko Teschke — Software Engineer, Enterprise Web UI, Palo Alto." />
  <script>document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="terminal.css" />
  <link rel="stylesheet" href="controls.css" />
</head>
<body>

  <div class="terminal" id="terminal">

    <!-- title bar -->
    <div class="t-bar">
      <span class="t-title">mirko@dev: ~</span>
      <span class="t-loc">Palo Alto, CA</span>
    </div>

    <!-- scrollable output -->
    <div class="t-output" id="output" role="log" aria-live="polite"></div>

    <!-- input row -->
    <div class="t-input-row">
      <span class="t-input-prompt">$</span>
      <input
        type="text"
        id="cmd-input"
        class="t-input"
        autocomplete="off"
        spellcheck="false"
        placeholder="type a command…"
        aria-label="Terminal command input"
      />
    </div>

    <!-- clickable command chips -->
    <div class="t-chips" id="chips">
      <span class="t-chips__label">run:</span>
      <button class="chip" data-cmd="whoami">whoami</button>
      <button class="chip" data-cmd="experience">experience</button>
      <button class="chip" data-cmd="stack">stack</button>
      <button class="chip" data-cmd="projects">projects</button>
      <button class="chip" data-cmd="principles">principles</button>
      <button class="chip" data-cmd="contact">contact</button>
      <a class="chip chip--link" href="resume.pdf" target="_blank" rel="noopener">resume ↗</a>
      <button class="chip chip--util" data-cmd="clear">clear</button>
    </div>

  </div>

  <!-- global view + theme controls -->
  <div class="g-ctrl">
    <button class="g-ctrl__seg" data-go="terminal" aria-label="Terminal view">terminal</button>
    <button class="g-ctrl__seg" data-go="classic" aria-label="Classic view">classic</button>
    <div class="g-ctrl__sep"></div>
    <button class="g-ctrl__seg" data-go-theme="dark" aria-label="Dark theme">dark</button>
    <button class="g-ctrl__seg" data-go-theme="light" aria-label="Light theme">light</button>
  </div>

  <script src="terminal.js"></script>
  <script src="controls.js"></script>
</body>
</html>
